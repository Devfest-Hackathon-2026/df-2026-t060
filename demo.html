<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f6fc">
  <title>デモ教室｜クラスで育つ教材</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/entry.css">
  <script src="offline-register.js" defer></script>
  <script type="module" src="js/inquiry-demo.js"></script>
</head>
<body>
  <header class="entry-header">
    <a class="entry-brand" href="index.html"><img src="icon.svg" width="36" height="36" alt="">クラスで育つ教材</a>
    <a class="entry-nav" href="index.html">入口へ戻る</a>
  </header>
  <main class="entry-main">
    <section class="entry-hero entry-demo">
      <p class="entry-kicker">デモ教室</p>
      <h1>実験から、クラスの次の問いへ。</h1>
      <p class="entry-lead">天体の軌道と音の教材が入ったクラスを作ります。先生・児童 A・児童 B の画面を、同じブラウザの別タブで開いて試せます。</p>
      <button id="create" class="entry-button" type="button" disabled>確認用のクラスと教材を作る <span aria-hidden="true">→</span></button>
      <p id="message" role="status"></p>
      <div id="links" class="entry-grid" aria-label="作成したクラスの画面"></div>
    </section>
    <section class="entry-section" aria-labelledby="demo-flow">
      <h2 id="demo-flow">デモで試せること</h2>
      <ol class="entry-steps">
        <li><strong>児童 A が実験する</strong><span>軌道の速さを変えて記録し、説明と次の問いを先生へ送ります。</span></li>
        <li><strong>先生が問いを教材にする</strong><span>届いた根拠を読み、比較案を確認してクラスに配信します。</span></li>
        <li><strong>児童 B が続きから調べる</strong><span>改訂された教材で2つの条件を比べ、自分の気づきを記録します。</span></li>
      </ol>
      <p class="entry-note">デモではログインやGemmaの準備は不要です。同期は、同じブラウザ内で行います。</p>
    </section>
  </main>
</body>
</html>
