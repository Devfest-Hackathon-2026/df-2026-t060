# Ollama(Gemma 入り)を Cloud Build でビルドして、Artifact Registry に入れる。モデルを取りこむので、時間とディスクが要る(イメージ 約 9GB)。
#   gcloud builds submit --config deploy/cloudrun/cloudbuild-ollama.yaml --substitutions _IMAGE=REGION-docker.pkg.dev/PROJECT/kyozai/ollama:latest,_MODEL=gemma4:12b deploy/cloudrun
steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "Dockerfile.ollama", "--build-arg", "MODEL=${_MODEL}", "-t", "${_IMAGE}", "."]
images:
  - "${_IMAGE}"
substitutions:
  _IMAGE: "REGION-docker.pkg.dev/PROJECT/kyozai/ollama:latest"
  _MODEL: "gemma4:12b"
timeout: 3600s
options:
  machineType: E2_HIGHCPU_8
  diskSizeGb: 100
