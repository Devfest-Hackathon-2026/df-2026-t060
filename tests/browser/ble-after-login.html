<!doctype html>
<meta charset="utf-8">
<title>児童:オンラインでログインしたあとに Bluetooth をつなぐ流れ</title>
<!-- 本物のブラウザで確かめる(node tools/browser-check.mjs ble-after-login)。
     オンラインは、デモ版の通信層(同じブラウザの中)で、Firebase のまね。Bluetooth は偽物(fake-bluetooth.js)で、先生PC側の窓口(RelayHub)をこのページの中に置く。
     ① まずクラスコード + 出席番号で入る(Bluetooth の入口は入る画面に出ない) ② クラスの画面の「Bluetooth」欄でつなぐ -->
<script type="importmap">{ "imports": { "/js/transport.js": "/__test/fake-transport.js" } }</script>
<link rel="stylesheet" href="/css/style.css">
<pre id="result"></pre>
<div id="stage"></div>
<script type="module">
import { RoomStore } from '/js/relay/room-store.js';
import { RelayHub } from '/js/relay/hub.js';
import { RelayPeripheral } from '/js/relay/peripheral.js';
import { SERVICE_UUID, RX_UUID, TX_UUID } from '/js/relay/protocol.js';
import { createFakeBluetooth } from '/__test/fake-bluetooth.js';

globalThis.__fakeKeepUrl = true;
const checks = []; const check = (n, ok, d = '') => checks.push({ name: n, ok: !!ok, detail: d });
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const $ = (id) => document.getElementById(id);
const errors = [];
addEventListener('error', (e) => errors.push(String(e.message)));
addEventListener('unhandledrejection', (e) => errors.push(String(e.reason?.message ?? e.reason)));
try {
  const store = new RoomStore(); const hub = new RelayHub({ store });
  const fake = createFakeBluetooth({ peripheral: new RelayPeripheral({ hub }), uuids: { service: SERVICE_UUID, rx: RX_UUID, tx: TX_UUID }, notifyBytes: 100, mtu: 103 });
  Object.defineProperty(navigator, 'bluetooth', { value: fake.bluetooth, configurable: true });
  const code = store.createClass({ name: '併用のクラス', grade: 6, code: 'HYB234' });
  store.publishMaterial(code, { id: 'm-ble', title: 'Bluetoothだけの教材', explanation: 'a', sim: null, quiz: [] });
  // オンライン側(デモの通信層)にも、クラスと教材を用意する
  localStorage.clear();
  localStorage.setItem('kyozai-demo:' + code, JSON.stringify({ name: '併用のクラス', grade: 6, materials: [{ id: 'm-on', title: 'オンラインの教材', explanation: 'b', sim: null, quiz: [], publishedAt: Date.now() }], questions: [], replies: [] }));

  history.replaceState(null, '', `${location.pathname}?code=${code}`);
  const html = await (await fetch('/student.html')).text();
  const body = new DOMParser().parseFromString(html, 'text/html').body;
  $('stage').replaceChildren(...[...body.childNodes].filter((n) => n.tagName !== 'SCRIPT'));
  await import('/js/student.js');
  await wait(300);

  check('最初は、クラスコードと出席番号で入る画面。Bluetooth の入口は、ここには出ない', !$('join').hidden && $('bleBox').hidden, `join=${$('join').hidden} bleBox=${$('bleBox').hidden}`);
  check('クラスコードが、リンクから入っている', $('codeInput').value === code);
  check('「入る」が、最初から押せる(Bluetooth を待たない)', !$('joinForm').querySelector('button').disabled);

  $('seatInput').value = '7';
  $('joinForm').dispatchEvent(new Event('submit', { cancelable: true }));
  await wait(600);
  check('オンラインで入れる', !$('app').hidden && /併用のクラス.*7番/.test($('who').textContent), $('who').textContent);
  check('オンラインの教材が見える', /オンラインの教材/.test($('materials').textContent), $('materials').textContent);
  check('Bluetooth 欄が出て、「つながっていません」と見える', !$('bleCard').hidden && /つながっていません/.test($('bleCardState').textContent), $('bleCardState').textContent);
  check('上の帯にも、Bluetooth の状態が出る', !$('bleState').hidden && /Bluetooth/.test($('bleState').textContent) && $('bleState').classList.contains('off'), $('bleState').textContent);
  check('欄のボタンが押せる', !$('bleCardBtn').disabled && !$('bleCardBtn').hidden);

  // 機器の選択をやめる
  fake.ctl.chooserCancels = true;
  $('bleCardBtn').click(); await wait(300);
  check('機器の選択をやめたら、理由が出て、もう一度押せる', /見つかりませんでした/.test($('bleCardMsg').textContent) && !$('bleCardBtn').disabled, $('bleCardMsg').textContent);
  fake.ctl.chooserCancels = false;

  // つなぐ
  $('bleCardBtn').click(); await wait(800);
  check('つながると「つながっています」(緑)になる', /つながっています/.test($('bleCardState').textContent) && $('bleCardState').classList.contains('on') && $('bleCard').classList.contains('on'), $('bleCardState').textContent);
  check('上の帯も「Bluetooth ●つながっています」', /●つながっています/.test($('bleState').textContent) && $('bleState').classList.contains('on'), $('bleState').textContent);
  check('先生PCの窓口に、1台つながっている', hub.sessionCount === 1, String(hub.sessionCount));
  check('オンラインの教材と Bluetooth の教材が、両方見える', /オンラインの教材/.test($('materials').textContent) && /Bluetoothだけの教材/.test($('materials').textContent), $('materials').textContent);
  check('オンラインの表示(ネット)は、そのまま', !/Bluetooth/.test($('net').textContent), $('net').textContent);

  // 同じ id の教材は1つにまとまる
  store.publishMaterial(code, { id: 'm-on', title: 'オンラインの教材', explanation: 'b', sim: null, quiz: [] });
  await wait(700);
  check('同じ id の教材は、2つに分かれない', ($('materials').textContent.match(/オンラインの教材/g) ?? []).length === 1, $('materials').textContent);

  // 切れたら、状態が変わり、もどったら直る
  fake.ctl.connectable = false; fake.drop();
  await wait(300);
  check('切れたら「つなぎなおしています」(黄)になる', /つなぎなおしています/.test($('bleCardState').textContent) && $('bleCardState').classList.contains('wait'), $('bleCardState').textContent);
  check('切れていても、オンラインの教材は見えたまま', /オンラインの教材/.test($('materials').textContent));
  fake.ctl.connectable = true;
  await wait(4500);
  check('電波がもどったら、自動でつながって、表示がもどる', /つながっています/.test($('bleCardState').textContent) && $('bleCardState').classList.contains('on'), $('bleCardState').textContent);

  check('画面のエラー(例外)が出ていない', errors.length === 0, errors.join(' / '));
} catch (e) { checks.push({ name: '例外', ok: false, detail: String(e.stack || e) }); }
document.getElementById('result').textContent = JSON.stringify({ ok: checks.every((c) => c.ok), checks });
</script>
