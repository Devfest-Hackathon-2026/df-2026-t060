<!doctype html>
<meta charset="utf-8">
<title>3D の操作のテスト</title>
<!-- 本物のブラウザで、3D 表示のマウス・タッチ操作を確かめる(node tools/browser-check.mjs three3d-input) -->
<body style="margin:0;background:#000">
<canvas id="c" style="width:800px;height:500px;display:block"></canvas>
<pre id="result"></pre>
<script type="module">
import { createThree3D } from '/js/sim2/render/three3d.js';
import { createEngine } from '/js/sim2/core/engine.js';
import { getSystem, defaultConfig } from '/js/sim2/systems/index.js';

const checks = [];
const check = (name, ok, detail = '') => checks.push({ name, ok: !!ok, detail });
const canvas = document.getElementById('c');
const box = canvas.getBoundingClientRect();
const at = (x, y) => ({ clientX: box.left + x, clientY: box.top + y });
const ptr = (type, id, x, y, pointerType = 'mouse') => canvas.dispatchEvent(new PointerEvent(type, { bubbles: true, cancelable: true, pointerId: id, pointerType, isPrimary: id === 1, buttons: type === 'pointerup' ? 0 : 1, ...at(x, y) }));
const near = (a, b, tol = 1e-9) => Math.abs(a - b) <= tol;

try {
  const sys = getSystem('orbit');
  const e = createEngine(sys, { ...defaultConfig('orbit'), params: { alt: 20000, ratio: 1.15, incl: 40, m: 1000 } });
  const r3 = await createThree3D(canvas);
  const draw = () => r3.frame(sys.model.view3d(e.observe(), e.p));
  for (let i = 0; i < 50; i++) { for (let k = 0; k < 20; k++) e.step(); draw(); }

  // マウスでドラッグ → 横・たてに回る
  const c0 = r3.camera();
  ptr('pointerdown', 1, 400, 250); ptr('pointermove', 1, 480, 230); ptr('pointerup', 1, 480, 230);
  const c1 = r3.camera();
  check('マウスのドラッグ(右へ80px)で横に回る', near(c1.theta, c0.theta - 80 * 0.008), `${c0.theta.toFixed(3)} → ${c1.theta.toFixed(3)}`);
  check('マウスのドラッグ(上へ20px)でたてに回る', near(c1.phi, c0.phi + 20 * 0.008), `${c0.phi.toFixed(3)} → ${c1.phi.toFixed(3)}`);
  // ボタンをはなしたあとに動かしても回らない
  ptr('pointermove', 1, 600, 100);
  check('はなしたあとは回らない', near(r3.camera().theta, c1.theta));
  // たてに大きく動かしても、真上・真下をこえない
  ptr('pointerdown', 1, 400, 250); ptr('pointermove', 1, 400, -5000); ptr('pointerup', 1, 400, -5000);
  const c2 = r3.camera();
  check('真上・真下をこえない', c2.phi > 0 && c2.phi < Math.PI, c2.phi.toFixed(3));

  // ホイール → 拡大・縮小(はばの中に収まる)
  const d0 = r3.camera().dist;
  canvas.dispatchEvent(new WheelEvent('wheel', { deltaY: 100, bubbles: true, cancelable: true, ...at(400, 250) }));
  const d1 = r3.camera().dist;
  canvas.dispatchEvent(new WheelEvent('wheel', { deltaY: -100, bubbles: true, cancelable: true, ...at(400, 250) }));
  canvas.dispatchEvent(new WheelEvent('wheel', { deltaY: -100, bubbles: true, cancelable: true, ...at(400, 250) }));
  const d2 = r3.camera().dist;
  check('ホイールを下へ → 遠ざかる(縮小)', d1 > d0, `${d0} → ${d1}`);
  check('ホイールを上へ → 近づく(拡大)', d2 < d1, `${d1} → ${d2}`);
  for (let i = 0; i < 100; i++) canvas.dispatchEvent(new WheelEvent('wheel', { deltaY: 100, bubbles: true, cancelable: true }));
  check('縮小には限りがある', r3.camera().dist <= 80, String(r3.camera().dist));
  const wheel = new WheelEvent('wheel', { deltaY: 100, bubbles: true, cancelable: true });
  canvas.dispatchEvent(wheel);
  check('ホイールでページがスクロールしない(preventDefault)', wheel.defaultPrevented);

  // タッチ:1本指で回る・2本指で広げると拡大、せばめると縮小
  for (let i = 0; i < 30; i++) canvas.dispatchEvent(new WheelEvent('wheel', { deltaY: -100, bubbles: true, cancelable: true }));
  for (let i = 0; i < 6; i++) canvas.dispatchEvent(new WheelEvent('wheel', { deltaY: 100, bubbles: true, cancelable: true }));
  const t0 = r3.camera();
  ptr('pointerdown', 11, 300, 250, 'touch'); ptr('pointermove', 11, 250, 250, 'touch'); ptr('pointerup', 11, 250, 250, 'touch');
  check('1本指で横に回る(タッチ)', near(r3.camera().theta, t0.theta + 50 * 0.008));
  const p0 = r3.camera().dist;
  ptr('pointerdown', 21, 350, 250, 'touch'); ptr('pointerdown', 22, 450, 250, 'touch');
  ptr('pointermove', 22, 450, 250, 'touch');   // 2本指のはじめのきょり(100px)
  ptr('pointermove', 22, 550, 250, 'touch');   // 200px に広げる
  const p1 = r3.camera().dist;
  check('2本指で広げると近づく(拡大)', near(p1, Math.max(8, p0 * 100 / 200)), `${p0.toFixed(2)} → ${p1.toFixed(2)}`);
  ptr('pointermove', 22, 450, 250, 'touch');   // 100px にせばめる
  check('2本指でせばめると遠ざかる(縮小)', r3.camera().dist > p1, `${p1.toFixed(2)} → ${r3.camera().dist.toFixed(2)}`);
  const th = r3.camera().theta;
  ptr('pointerup', 21, 350, 250, 'touch'); ptr('pointerup', 22, 450, 250, 'touch');
  check('2本指のあいだは回らない', near(r3.camera().theta, th));
  // 描いた絵に、背景以外の色(地球の青・軌道の赤)がある(描いた直後に写しとって数える)
  draw();
  const copy = document.createElement('canvas'); copy.width = canvas.width; copy.height = canvas.height;
  const cx = copy.getContext('2d'); cx.drawImage(canvas, 0, 0);
  const px = cx.getImageData(0, 0, copy.width, copy.height).data;
  let blue = 0, red = 0;
  for (let i = 0; i < px.length; i += 4) { if (px[i + 2] > 150 && px[i] < 120) blue++; if (px[i] > 180 && px[i + 1] < 140) red++; }
  check('3D の絵が出ている(地球の青・軌道の赤)', blue > 50 && red > 20, `青 ${blue} 点・赤 ${red} 点`);
  r3.dispose();
  ptr('pointerdown', 1, 400, 250); ptr('pointermove', 1, 500, 250);
  check('dispose のあとは操作を受けつけない', near(r3.camera().theta, th));
} catch (err) {
  checks.push({ name: '例外', ok: false, detail: String(err && err.stack || err) });
}
document.getElementById('result').textContent = JSON.stringify({ ok: checks.every((c) => c.ok), checks });
</script>
