<!doctype html>
<meta charset="utf-8">
<title>デモモードでは、Bluetooth の表示が出ない(友達のデモ画面をそのまま見せる)</title>
<!-- 本物のブラウザで、先生の画面を、localhost で、デモモード(?demo)で開いたとき、Bluetooth の表示・先生PCへの問い合わせがないことを確かめる
     (node tools/browser-check.mjs demo-unchanged)。 -->
<link rel="stylesheet" href="/css/style.css">
<pre id="result"></pre>
<div id="stage"></div>
<script type="module">
const checks = []; const check = (n, ok, d = '') => checks.push({ name: n, ok: !!ok, detail: d });
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const $ = (id) => document.getElementById(id);
const asked = [];
const realFetch = window.fetch.bind(window);
window.fetch = (u, o) => { asked.push(String(u)); return realFetch(u, o); };
try {
  localStorage.clear();
  history.replaceState(null, '', `${location.pathname}?demo`);
  const html = await (await realFetch('/teacher.html')).text();
  const body = new DOMParser().parseFromString(html, 'text/html').body;
  $('stage').replaceChildren(...[...body.childNodes].filter((n) => n.tagName !== 'SCRIPT'));
  await import('/js/teacher.js');
  await wait(500);
  $('className').value = 'デモのクラス'; $('grade').value = '6';
  $('setupForm').dispatchEvent(new Event('submit', { cancelable: true }));
  await wait(1200);
  check('クラスができる(これまでどおりのデモ)', !$('app').hidden && /^[A-HJ-NP-Z2-9]{6}$/.test($('code').textContent), $('code').textContent);
  check('Bluetooth の状態の行は、出ない', $('bleStatus').hidden && $('bleStatus').textContent === '', $('bleStatus').textContent);
  check('先生PCの Bluetooth 教室(/relay/)に、問い合わせをしていない', !asked.some((u) => u.includes('/relay/')), asked.filter((u) => u.includes('/relay/')).join());
  check('児童用ページのリンクは、デモ(?demo)のまま', /student\.html\?.*demo/.test($('studentUrl').textContent), $('studentUrl').textContent);
} catch (e) { checks.push({ name: '例外', ok: false, detail: String(e.stack || e) }); }
document.getElementById('result').textContent = JSON.stringify({ ok: checks.every((c) => c.ok), checks });
</script>
