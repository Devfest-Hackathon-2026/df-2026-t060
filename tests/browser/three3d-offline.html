<!doctype html>
<meta charset="utf-8">
<title>外への通信が止められても 3D が出るか</title>
<!-- jsdelivr(外)を読めない状態でも、同梱の Three.js で 3D が出ることを確かめる(node tools/browser-check.mjs three3d-offline) -->
<link rel="stylesheet" href="/css/style.css">
<body style="margin:8px"><div id="h"></div><pre id="result"></pre>
<script type="module">
import { THREE_LOCAL_URL, loadThree } from '/js/sim2/render/three3d.js';
import { mountSimulation } from '/js/sim2/ui/player.js';
import { getSystem } from '/js/sim2/systems/index.js';
const checks = []; const check = (n, ok, d = '') => checks.push({ name: n, ok: !!ok, detail: d });
try {
  check('同梱版の場所は、このサイトの中', THREE_LOCAL_URL.startsWith(location.origin) && THREE_LOCAL_URL.endsWith('/js/vendor/three.module.js'), THREE_LOCAL_URL);
  // 外(jsdelivr)をわざと読めない住所にして、同梱版だけで読めるか
  const T = await loadThree([THREE_LOCAL_URL, 'https://blocked.invalid/three.js']);
  check('同梱版だけで Three.js が読める(REVISION 160)', T.REVISION === '160', T.REVISION);
  // 1つめがだめなら、2つめを試す
  const fb = await loadThree(['/js/vendor/not-found.js', THREE_LOCAL_URL]);
  check('1つめがだめなら2つめを試す', fb.REVISION === '160');
  // どちらもだめなときは、理由つきの例外
  let msg = ''; try { await loadThree(['/nope-1.js', '/nope-2.js']); } catch (e) { msg = e.message; }
  check('どちらもだめなら理由を出す', /同梱の3D描画を読み込めません/.test(msg) && msg.includes('nope-1.js') && msg.includes('nope-2.js'), msg);
  // 画面:ふつうに 3D が出る
  mountSimulation(document.getElementById('h'), { ...getSystem('solar').examples[0].config, view: { mode: 'explore' } });
  await new Promise((r) => setTimeout(r, 2500));
  const cs = [...document.querySelectorAll('canvas.s2-canvas')];
  check('太陽系が 3D で出る', cs[0].hidden && !cs[1].hidden);
  check('「読みこめなかった」の文が出ていない', document.querySelector('.s2-warn').hidden, document.querySelector('.s2-warn').textContent);
} catch (e) { checks.push({ name: '例外', ok: false, detail: String(e.stack || e) }); }
document.getElementById('result').textContent = JSON.stringify({ ok: checks.every((c) => c.ok), checks });
</script>
