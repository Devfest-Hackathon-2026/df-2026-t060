<!doctype html>
<meta charset="utf-8">
<title>2D/3D の切りかえのテスト</title>
<!-- 本物のブラウザで、シミュレーションの画面(player)の 2D/3D 切りかえ・速さ・エネルギーの単位を確かめる(node tools/browser-check.mjs player-3d) -->
<link rel="stylesheet" href="/css/style.css">
<body style="margin:8px">
<div id="h1"></div><div id="h2"></div>
<pre id="result"></pre>
<script type="module">
import { mountSimulation } from '/js/sim2/ui/player.js';
import { getSystem } from '/js/sim2/systems/index.js';

const checks = [];
const check = (name, ok, detail = '') => checks.push({ name, ok: !!ok, detail });
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const btn = (host, text) => [...host.querySelectorAll('.s2-btn')].find((b) => b.textContent === text);
const shown = (host) => [...host.querySelectorAll('canvas.s2-canvas')].filter((c) => !c.hidden).length;

try {
  // 人工衛星:3D ではじめる
  const h1 = document.getElementById('h1');
  let last = null;
  const sim = mountSimulation(h1, { ...getSystem('orbit').examples[0].config, render: '3d', view: { mode: 'explore' } }, { onChange: (c) => { last = c; } });
  await wait(3000);
  const [c2d, c3d] = h1.querySelectorAll('canvas.s2-canvas');
  check('3D の絵だけを出す', c2d.hidden && !c3d.hidden && shown(h1) === 1);
  check('ボタンは「2D表示」', !!btn(h1, '2D表示'));
  check('速さは例の設定(10倍)', h1.querySelector('.s2-speed').value === '10', h1.querySelector('.s2-speed').value);
  btn(h1, '2D表示').click();
  await wait(300);
  check('2D に切りかえると 2D の絵だけ', !c2d.hidden && c3d.hidden);
  check('切りかえを設定に残す(render: 2d)', last?.render === '2d');
  btn(h1, '3D表示').click();
  await wait(300);
  check('3D にもどせる', c2d.hidden && !c3d.hidden && last?.render === '3d');
  // コマ送りで時間が進み、3D の絵も描きかわる(ヘッドレスでは requestAnimationFrame がほとんど呼ばれないので、ボタンで進める)
  const t0 = sim.engine().t;
  for (let i = 0; i < 5; i++) btn(h1, 'コマ送り').click();
  check('コマ送りで時間が進む', sim.engine().t > t0, `t=${t0} → ${sim.engine().t}`);
  // 投射運動:2D ではじめて、3D にできる
  const h2 = document.getElementById('h2');
  mountSimulation(h2, { ...getSystem('projectile').examples[1].config, view: { mode: 'explore', graph: 'energy' } });
  await wait(500);
  check('投射運動は 2D ではじまる', shown(h2) === 1 && !h2.querySelectorAll('canvas.s2-canvas')[0].hidden);
  btn(h2, '3D表示').click();
  await wait(2000);
  check('投射運動も 3D にできる', h2.querySelectorAll('canvas.s2-canvas')[0].hidden && !h2.querySelectorAll('canvas.s2-canvas')[1].hidden);
  const speeds = [...h2.querySelectorAll('.s2-speed option')].map((o) => o.value).join(',');
  check('投射運動の速さはふつうの倍率', speeds === '0.25,0.5,1,2', speeds);
} catch (err) {
  checks.push({ name: '例外', ok: false, detail: String(err && err.stack || err) });
}
document.getElementById('result').textContent = JSON.stringify({ ok: checks.every((c) => c.ok), checks });
</script>
