<!doctype html>
<meta charset="utf-8">
<title>児童の画面(Bluetooth)のテスト</title>
<!-- 本物のブラウザで、児童の画面の Bluetooth の流れを確かめる(node tools/browser-check.mjs ble-student)。
     navigator.bluetooth を偽物(fake-bluetooth.js)にして、先生PC側の窓口(RelayHub)を、このページの中に置く。本物の Bluetooth の機器は使わない。 -->
<link rel="stylesheet" href="/css/style.css">
<pre id="result"></pre>
<div id="stage"></div>
<script type="module">
import { RoomStore } from '/js/relay/room-store.js';
import { RelayHub } from '/js/relay/hub.js';
import { RelayPeripheral } from '/js/relay/peripheral.js';
import { SERVICE_UUID, RX_UUID, TX_UUID } from '/js/relay/protocol.js';
import { createFakeBluetooth } from '/__test/fake-bluetooth.js';

const checks = []; const check = (n, ok, d = '') => checks.push({ name: n, ok: !!ok, detail: d });
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const $ = (id) => document.getElementById(id);
const errors = [];
addEventListener('error', (e) => errors.push(String(e.message)));
addEventListener('unhandledrejection', (e) => errors.push(String(e.reason?.message ?? e.reason)));
try {
  // 先生PC側(このページの中):教室のデータ・窓口・Bluetooth の待ち受け(偽)
  const store = new RoomStore(); const hub = new RelayHub({ store });
  const peripheral = new RelayPeripheral({ hub });
  const fake = createFakeBluetooth({ peripheral, uuids: { service: SERVICE_UUID, rx: RX_UUID, tx: TX_UUID }, notifyBytes: 100, mtu: 103 });
  Object.defineProperty(navigator, 'bluetooth', { value: fake.bluetooth, configurable: true });
  const code = store.createClass({ name: '5年2組 理科', grade: 5 });
  store.publishMaterial(code, { title: '先に配信した教材', explanation: 'a', sim: null, quiz: [] });

  localStorage.clear();
  history.replaceState(null, '', `${location.pathname}?ble&code=${code}`);
  const html = await (await fetch('/student.html')).text();
  const body = new DOMParser().parseFromString(html, 'text/html').body;
  $('stage').replaceChildren(...[...body.childNodes].filter((n) => n.tagName !== 'SCRIPT'));
  await import('/js/student.js');
  await wait(300);

  check('入る画面と「Bluetooth でつなぐ」が出る', !$('join').hidden && !$('bleBox').hidden);
  check('つながるまで「入る」は押せない', $('joinForm').querySelector('button').disabled);
  check('クラスコードが、リンクから入っている', $('codeInput').value === code, $('codeInput').value);
  check('この時点では、ネットの通信層(Firebase)を作っていない(モード表示は空)', $('mode').textContent === '', $('mode').textContent);

  // 機器の選択をやめたとき
  fake.ctl.chooserCancels = true;
  $('bleConnect').click(); await wait(300);
  check('機器の選択をやめたら、見つからなかった理由と、もう一度押せる状態', /見つかりませんでした/.test($('bleMsg').textContent) && !$('bleConnect').disabled, $('bleMsg').textContent);
  fake.ctl.chooserCancels = false;

  // つなぐ
  $('bleConnect').click(); await wait(600);
  check('つながったら、ボタンの欄は消え、「入る」が押せる', $('bleBox').hidden && !$('joinForm').querySelector('button').disabled, $('bleMsg').textContent);
  check('モードの表示は「Bluetooth」', /Bluetooth/.test($('mode').textContent), $('mode').textContent);

  // クラスに入る
  $('seatInput').value = '5';
  $('joinForm').dispatchEvent(new Event('submit', { cancelable: true }));
  await wait(1200);
  check('入ると、クラスの画面が出る', !$('app').hidden && /5年2組 理科.*5番/.test($('who').textContent), $('who').textContent);
  check('先に配信してあった教材が、Bluetooth で届いて出る', /先に配信した教材/.test($('materials').textContent), $('materials').textContent);
  check('ネットの表示が、Bluetooth のつながりの表示になる', /Bluetoothでつながっています/.test($('net').textContent), $('net').textContent);
  const saved = JSON.parse(localStorage.getItem('kyozai-student'));
  check('入ったクラスを覚える(Bluetooth の印 via: ble つき)', saved.code === code && saved.via === 'ble', JSON.stringify(saved));
  check('先生PCの窓口に、1台つながっている', hub.sessionCount === 1, String(hub.sessionCount));

  // 先生が、あとから教材を配信 → すぐ届く。返事 → 自分あてだけ
  store.publishMaterial(code, { title: 'あとから配信', explanation: 'b', sim: null, quiz: [] });
  await wait(800);
  check('あとから配信した教材も、すぐ届く', /あとから配信/.test($('materials').textContent), $('materials').textContent);

  // 電波がとだえる → 表示が変わる → もどる
  fake.ctl.connectable = false; fake.drop();
  await wait(300);
  check('切れたら、「つなぎなおしています」と出る(送れていない質問がなければ、案内は出さない)', /つなぎなおしています/.test($('net').textContent) && !/件/.test($('net').textContent), $('net').textContent);
  check('切れていても、届いた教材は見えたまま', /あとから配信/.test($('materials').textContent));
  store.publishMaterial(code, { title: '切れている間の教材', explanation: 'c', sim: null, quiz: [] });
  fake.ctl.connectable = true;
  await wait(4500); // つなぎなおしは、1秒・2秒…と間をあけて試す
  check('電波がもどったら、自動でつながって、表示がもどる', /Bluetoothでつながっています/.test($('net').textContent), $('net').textContent);
  check('切れていた間に配信された教材も、つなぎなおしたら届く', /切れている間の教材/.test($('materials').textContent), $('materials').textContent);

  check('画面のエラー(例外)が出ていない', errors.length === 0, errors.join(' / '));
} catch (e) { checks.push({ name: '例外', ok: false, detail: String(e.stack || e) }); }
document.getElementById('result').textContent = JSON.stringify({ ok: checks.every((c) => c.ok), checks });
</script>
