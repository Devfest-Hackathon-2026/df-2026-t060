<!doctype html>
<meta charset="utf-8">
<title>太陽系のテスト</title>
<!-- 本物のブラウザで、太陽系(多体・3D)の画面を確かめる(node tools/browser-check.mjs solar) -->
<link rel="stylesheet" href="/css/style.css">
<body style="margin:8px">
<div id="h"></div>
<pre id="result"></pre>
<script type="module">
import { mountSimulation } from '/js/sim2/ui/player.js';
import { getSystem } from '/js/sim2/systems/index.js';

const checks = [];
const check = (name, ok, detail = '') => checks.push({ name, ok: !!ok, detail });
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
try {
  const h = document.getElementById('h');
  const sim = mountSimulation(h, { ...getSystem('solar').examples[0].config, view: { mode: 'explore' } });
  await wait(2500);
  const cs = h.querySelectorAll('canvas.s2-canvas');
  check('3D ではじまる', cs[0].hidden && !cs[1].hidden);
  const step = [...h.querySelectorAll('.s2-btn')].find((b) => b.textContent === 'コマ送り');
  for (let i = 0; i < 60; i++) step.click();
  check('コマ送りで時間(年)が進む', sim.engine().t > 0.01, `t=${sim.engine().t.toFixed(4)} 年`);
  const reads = [...h.querySelectorAll('.s2-read .k')].map((x) => x.textContent).join('・');
  check('地球の公転周期を出す', reads.includes('地球の公転周期'), reads);
  const sel = h.querySelector('.s2-ctrl select');
  sel.value = 'outer'; sel.dispatchEvent(new Event('change'));
  await wait(500);
  const reads2 = [...h.querySelectorAll('.s2-read .k')].map((x) => x.textContent).join('・');
  check('外わくに切りかえると木星の公転周期を出す', reads2.includes('木星の公転周期'), reads2);
  check('外わくでは刻みが大きい(0.005年)', sim.engine().dt === 0.005, String(sim.engine().dt));
  for (let i = 0; i < 30; i++) step.click();
  check('物理の確かめの警告が出ない', h.querySelector('.s2-warn').hidden, h.querySelector('.s2-warn').textContent);
} catch (err) {
  checks.push({ name: '例外', ok: false, detail: String(err && err.stack || err) });
}
document.getElementById('result').textContent = JSON.stringify({ ok: checks.every((c) => c.ok), checks });
</script>
