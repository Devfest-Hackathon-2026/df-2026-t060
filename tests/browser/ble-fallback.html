<!doctype html>
<meta charset="utf-8">
<title>オンラインにつながらないとき、Bluetooth に切りかわるか</title>
<!-- 本物のブラウザで、児童の画面が、オンラインにつながらないとき(10秒たっても通信層が返らない)、Bluetooth で入れるようになることを確かめる
     (node tools/browser-check.mjs ble-fallback)。オンラインの通信層は、fake-transport.js(import map)で、いつまでも返らないものにする。
     Bluetooth は偽物(fake-bluetooth.js)で、先生PC側の窓口(RelayHub)を、このページの中に置く。 -->
<script type="importmap">{ "imports": { "/js/transport.js": "/__test/fake-transport.js" } }</script>
<link rel="stylesheet" href="/css/style.css">
<pre id="result"></pre>
<div id="stage"></div>
<script type="module">
import { RoomStore } from '/js/relay/room-store.js';
import { RelayHub } from '/js/relay/hub.js';
import { RelayPeripheral } from '/js/relay/peripheral.js';
import { SERVICE_UUID, RX_UUID, TX_UUID } from '/js/relay/protocol.js';
import { createFakeBluetooth } from '/__test/fake-bluetooth.js';
import { fake } from '/__test/fake-transport.js';

const checks = []; const check = (n, ok, d = '') => checks.push({ name: n, ok: !!ok, detail: d });
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const $ = (id) => document.getElementById(id);
const errors = [];
addEventListener('error', (e) => errors.push(String(e.message)));
addEventListener('unhandledrejection', (e) => errors.push(String(e.reason?.message ?? e.reason)));
try {
  const store = new RoomStore(); const hub = new RelayHub({ store });
  const fakeBt = createFakeBluetooth({ peripheral: new RelayPeripheral({ hub }), uuids: { service: SERVICE_UUID, rx: RX_UUID, tx: TX_UUID }, notifyBytes: 100, mtu: 103 });
  Object.defineProperty(navigator, 'bluetooth', { value: fakeBt.bluetooth, configurable: true });
  const code = store.createClass({ name: '併用のクラス', grade: 6, code: 'HYB234' });
  store.publishMaterial(code, { title: 'オンラインでも配った教材', explanation: 'a', sim: null, quiz: [] });

  localStorage.clear();
  fake.hang = true; // オンラインにつながらない
  history.replaceState(null, '', `${location.pathname}?code=${code}`); // ?ble はついていない(ふつうのリンク)
  const html = await (await fetch('/student.html')).text();
  const body = new DOMParser().parseFromString(html, 'text/html').body;
  $('stage').replaceChildren(...[...body.childNodes].filter((n) => n.tagName !== 'SCRIPT'));
  await import('/js/student.js'); // オンラインを10秒待って、あきらめる(仮想の時間なので、すぐ)
  await wait(300);

  check('オンラインを待ったあと、入る画面と Bluetooth の入口が出る', !$('join').hidden && !$('bleBox').hidden);
  check('「オンラインにつながりません」と、Bluetooth を勧める文が出る', /オンラインにつながりません/.test($('bleLead').textContent), $('bleLead').textContent);
  check('Bluetooth がつながるまで、「入る」は押せない', $('joinForm').querySelector('button').disabled);
  check('クラスコードは、リンクから入っている', $('codeInput').value === code);
  $('bleConnect').click(); await wait(800);
  check('Bluetooth でつながると、「入る」が押せる', !$('joinForm').querySelector('button').disabled && /つながりました/.test($('bleMsg').textContent), $('bleMsg').textContent);
  $('seatInput').value = '9';
  $('joinForm').dispatchEvent(new Event('submit', { cancelable: true }));
  await wait(1200);
  check('Bluetooth で、クラスに入れる', !$('app').hidden && /併用のクラス.*9番/.test($('who').textContent), $('who').textContent);
  check('教材が届く', /オンラインでも配った教材/.test($('materials').textContent), $('materials').textContent);
  check('モードは Bluetooth。入ったクラスに Bluetooth の印が残る', /Bluetooth/.test($('mode').textContent) && JSON.parse(localStorage.getItem('kyozai-student')).via === 'ble');
  check('画面のエラー(例外)が出ていない', errors.length === 0, errors.join(' / '));
} catch (e) { checks.push({ name: '例外', ok: false, detail: String(e.stack || e) }); }
document.getElementById('result').textContent = JSON.stringify({ ok: checks.every((c) => c.ok), checks });
</script>
