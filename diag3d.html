<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D表示の診断</title>
<style>
  body { font: 16px/1.7 "BIZ UDPGothic", "Hiragino Sans", sans-serif; max-width: 720px; margin: 24px auto; padding: 0 16px; color: #1c2333; }
  h1 { font-size: 20px; }
  li { margin: 6px 0; list-style: none; padding: 6px 10px; border-radius: 8px; background: #f1f4fb; }
  li.ok { background: #e4f7e8; } li.ng { background: #fde4e4; font-weight: bold; } li.wait { background: #fff6d6; }
  code { font-size: 13px; word-break: break-all; }
  #verdict { margin-top: 16px; padding: 12px; border-radius: 10px; background: #eef; }
  canvas { width: 100%; height: 220px; background: #0f1522; border-radius: 10px; display: block; margin-top: 12px; }
</style>
</head>
<body>
<h1>3D表示の診断</h1>
<p>このページは、3D表示ができない原因を調べます。結果をそのまま(スクリーンショットか文字で)教えてください。</p>
<ul id="list"></ul>
<div id="verdict">調べています…</div>
<canvas id="c"></canvas>
<script type="module">
const list = document.getElementById('list');
const add = (text, state = 'wait') => { const li = document.createElement('li'); li.className = state; li.textContent = text; list.append(li); return (t, s) => { li.textContent = t; li.className = s; }; };
const fails = [];
const step = async (name, fn) => {
  const set = add(`${name} …`);
  try { const detail = await fn(); set(`✔ ${name}${detail ? `:${detail}` : ''}`, 'ok'); return true; }
  catch (e) { const m = String(e?.message ?? e); set(`✖ ${name}:${m}`, 'ng'); fails.push([name, m]); return false; }
};

add(`ブラウザ:${navigator.userAgent}`, 'ok');
add(`アドレス:${location.href}`, 'ok');
add(`この画面は安全な場所(https か localhost):${window.isSecureContext ? 'はい' : 'いいえ'}`, window.isSecureContext ? 'ok' : 'ng');

let THREE = null;
await step('① Three.js の同梱版を読む(このサイトの中)', async () => {
  const url = new URL('./js/vendor/three.module.js', location.href).href;
  const res = await fetch(url, { cache: 'no-store' });
  if (!res.ok) throw new Error(`HTTP ${res.status}(サーバーが古いか、ファイルがありません)`);
  const text = await res.text();
  if (!/REVISION\s*=\s*'160'/.test(text)) throw new Error('中身が Three.js ではありません(' + text.slice(0, 60) + ')');
  THREE = await import(url);
  return `Three.js ${THREE.REVISION}(${Math.round(text.length / 1024)} KB)`;
});
await step('② 外(jsdelivr)の Three.js を読む(同梱版が読めたなら、なくても動きます)', async () => {
  const res = await fetch('https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js', { mode: 'cors' });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return '読めます';
}).then((ok) => { if (!ok) fails.pop(); }); // ここのエラーは、致命的ではないので数えない

const gl = (() => { const c = document.createElement('canvas'); return c.getContext('webgl2') || c.getContext('webgl') || c.getContext('experimental-webgl'); })();
await step('③ WebGL(3D を描く機能)が使える', async () => {
  if (!gl) throw new Error('使えません。Chrome の設定 → システム →「ハードウェア アクセラレーションが使用可能な場合は使用する」をオンにして、再起動してください。Edge も同じ設定があります。');
  const ext = gl.getExtension('WEBGL_debug_renderer_info');
  const name = ext ? gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) : '(名前は非公開)';
  return `${name}`;
});
await step('④ Three.js で実際に描く', async () => {
  if (!THREE) throw new Error('①が失敗しているので、試せません');
  const canvas = document.getElementById('c');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setSize(canvas.clientWidth, canvas.clientHeight, false);
  const scene = new THREE.Scene(), camera = new THREE.PerspectiveCamera(45, canvas.clientWidth / canvas.clientHeight, 0.1, 100);
  camera.position.set(0, 0, 4);
  scene.add(new THREE.AmbientLight(0xffffff, 0.6), new THREE.DirectionalLight(0xffffff, 1));
  const ball = new THREE.Mesh(new THREE.SphereGeometry(1, 32, 24), new THREE.MeshStandardMaterial({ color: 0x4dabf7 }));
  scene.add(ball);
  renderer.render(scene, camera);
  return '青い球が下に出ていれば成功です';
});
await step('⑤ アプリの 3D 表示(太陽系)を動かす', async () => {
  const { createThree3D } = await import('./js/sim2/render/three3d.js');
  const { createEngine } = await import('./js/sim2/core/engine.js');
  const { getSystem, defaultConfig } = await import('./js/sim2/systems/index.js');
  const sys = getSystem('solar'), e = createEngine(sys, defaultConfig('solar'));
  const canvas = document.createElement('canvas'); canvas.style.cssText = 'width:300px;height:200px';
  document.body.append(canvas); // 大きさを決めるために、いったん画面に入れる
  const r3 = await createThree3D(canvas);
  for (let i = 0; i < 20; i++) { e.step(); r3.frame(sys.model.view3d(e.observe(), e.p)); }
  r3.dispose(); canvas.remove();
  return '動きました';
});

await step('⑥ WebGL なしの簡易3D表示(⑤が失敗しても、これが成功すれば 3D は見られます)', async () => {
  const { createCanvas3D } = await import('./js/sim2/render/canvas3d.js');
  const { createEngine } = await import('./js/sim2/core/engine.js');
  const { getSystem, defaultConfig } = await import('./js/sim2/systems/index.js');
  const sys = getSystem('solar'), e = createEngine(sys, defaultConfig('solar'));
  const canvas = document.createElement('canvas'); canvas.style.cssText = 'width:300px;height:200px';
  document.body.append(canvas);
  const r3 = createCanvas3D(canvas);
  for (let i = 0; i < 20; i++) { e.step(); r3.frame(sys.model.view3d(e.observe(), e.p)); }
  r3.dispose(); canvas.remove();
  return '動きました';
});
const simpleOk = !fails.some(([n]) => n.startsWith('⑥'));
const v = document.getElementById('verdict');
if (fails.length && simpleOk && !fails.some(([n]) => /^[①]/.test(n))) {
  v.style.background = '#fff6d6';
  v.textContent = '△ WebGL は使えませんが、簡易3D表示は動きます。教材の画面では、自動で簡易3Dに切りかわります(ドラッグで回転できます)。きれいな3D(球に陰がつく)にするには、ブラウザの「ハードウェア アクセラレーション」をオンにして、再起動してください。';
} else if (!fails.length) {
  v.style.background = '#e4f7e8';
  v.textContent = '✔ すべて成功です。このブラウザでは 3D が出るはずです。教材の画面で「3D表示」が出ない場合は、ページを Ctrl+Shift+R で再読み込みしてください。それでも出なければ、この結果と、教材の画面に出ている文を教えてください。';
} else {
  v.style.background = '#fde4e4';
  v.textContent = `✖ 止まっているところ:${fails.map(([n]) => n.split(' ')[0]).join('、')}。上の赤い文を教えてください。`;
}
document.title = fails.length ? '3D表示の診断:NG' : '3D表示の診断:OK';
</script>
</body>
</html>
