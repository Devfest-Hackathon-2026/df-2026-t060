<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ことばの辞書 | クラスで育つ教材</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { background: var(--s2-bg, #0f1522); color: var(--s2-ink, #e8edf7); }
    main { max-width: 1100px; margin: 24px auto; padding: 0 16px 48px; }
    h1 { font-size: 24px; } h2 { font-size: 18px; margin-top: 28px; }
    table { width: 100%; border-collapse: collapse; font-size: 15px; }
    th, td { border-bottom: 1px solid var(--s2-line, #2b3750); padding: 8px 6px; text-align: left; vertical-align: top; }
    td.num { text-align: right; font-variant-numeric: tabular-nums; }
    .row-tools { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .row-tools input { min-height: 40px; border-radius: 10px; padding: 4px 8px; background: var(--s2-panel, #172033); color: inherit; border: 1px solid var(--s2-line, #2b3750); font: inherit; width: 12em; }
    .ok { color: #7fd8a5; } .warn { color: #ffcc66; }
    pre { background: var(--s2-panel, #172033); padding: 12px; border-radius: 10px; overflow: auto; max-height: 320px; font-size: 13px; }
    .lead { color: var(--s2-muted, #8a97ad); line-height: 1.8; }
  </style>
</head>
<body>
  <main class="s2">
    <p><a href="teacher.html" style="color:#8ab4ff">← 先生画面にもどる</a></p>
    <h1>ことばの辞書を育てる</h1>
    <p class="lead">児童の実験助手が「わからなかった」言い方を集めて、辞書に足します。児童の端末で「先生にわたすファイルを作る」を押したファイルを読みこんでください(いくつでも)。
      ファイルの中身は、このブラウザの中だけで使います(サーバーには送りません)。足した辞書は、このブラウザにすぐ使われます。クラス全員の端末で使うには、「書き出す」でできたファイルを <code>public/js/sim2/systems/student-words.json</code> に合わせて配信します。</p>
    <div class="s2-btns">
      <label class="s2-btn">記録のファイルを読みこむ <input id="files" type="file" accept=".json,application/json" multiple hidden></label>
      <span id="loadMsg" class="s2-note" role="status"></span>
    </div>

    <h2>わからなかった言い方(多い順)</h2>
    <div id="list"><p class="s2-note">まだ読みこんでいません。</p></div>

    <h2>この端末で足した辞書</h2>
    <p id="check" class="s2-note" role="status"></p>
    <div class="s2-btns">
      <button id="export" type="button" class="s2-btn primary">書き出す(student-words.json に入れる用)</button>
      <button id="reset" type="button" class="s2-btn">この端末で足した辞書を消す</button>
    </div>
    <pre id="extra"></pre>
  </main>
  <script type="module" src="js/words.js"></script>
</body>
</html>
